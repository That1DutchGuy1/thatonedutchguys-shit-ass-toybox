<!DOCTYPE html>
<html lang="en">
<head>
<script src="../device-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mah boi, this stupid lil piece of shit is CD-i Tinder! A web app that features CD-i Zelda characters and looks like a Windows 95 program lol.">
<title>CD-i Tinder 💖</title>
<link rel="icon" type="image/x-icon" href="./cd-i-tinder.ico">
<link rel="stylesheet" href="./cd-i-tinder.css">
</head>
<body>

<div class="window">
  <div class="title-bar">
    <span>💘 CD-i Tinder v1.0</span>
    <button class="close-btn" data-action="home">X</button>
  </div>

  <div class="content">
    <!-- SWIPE SCREEN -->
    <div id="swipe-view">
      <div class="card">
        <img id="prof-img" class="profile-pic" src="" alt="Profile">
        <div class="name-age"><span id="prof-name"></span>, <span id="prof-age"></span></div>
        <div class="gender-tag" id="prof-gender"></div>
        <div class="bio-box" id="prof-bio"></div>
      </div>
      <div class="buttons">
        <button class="btn" data-action="pass" title="Pass">❌</button>
        <button class="btn" data-action="like" title="Like">💖</button>
      </div>
    </div>

    <!-- MATCH SCREEN -->
    <div id="match-view">
      <h1>IT'S A MATCH! 🤯</h1>
      <p>You and <strong id="match-name"></strong> liked each other!</p>
      <img id="match-img" class="match-img" src="" alt="Match">
      <button class="btn btn-text" data-action="open-chat">Send a Message 💬</button>
      <button class="btn btn-text match-back-btn" data-action="back-to-swiping">Keep Swiping</button>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-view">
      <div class="chat-header">
        <img id="chat-avatar" src="" alt="">
        <span class="cname" id="chat-name"></span>
        <button class="back-btn" data-action="back-to-swiping">‹ back</button>
      </div>
      <div class="chat-box" id="chat-box"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type something...">
        <button class="btn btn-text" data-action="send-message">Send</button>
      </div>
      <div class="date-btn-row">
        <button class="btn btn-text date-action" data-action="go-on-date">💐 Ask them on a date</button>
      </div>
    </div>

    <!-- DATE SCREEN -->
    <div id="date-view">
      <div class="chat-header">
        <img id="date-avatar" src="" alt="">
        <span class="cname" id="date-name"></span>
        <button class="back-btn" data-action="back-to-chat">‹ back to chat</button>
      </div>
      <div class="date-title" id="date-title">Your Date</div>
      <div class="date-scene" id="date-scene">Loading date...</div>
    </div>

  </div>
</div>


<script src="./cd-i-tinder.js" defer></script>
</body>
</html>
