<!DOCTYPE html>
<html lang="en">
<head>
<script src="../device-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex, nofollow">
<title>Grand Meme Prix 3D</title>
<link rel="icon" type="image/x-icon" href="../grand-meme-prix/favicon.ico">
<link rel="stylesheet" href="grand_meme_prix.css">
</head>
<body>

<!-- MAIN MENU -->
<div id="mainMenu">
  <div class="stars" id="starsContainer"></div>
  <h1>🏎️ GRAND<br>MEME PRIX 🏎️ <br> 3D</h1>
  <div class="subtitle">2-PLAYER LOCAL CO-OP</div>

  <div class="char-select-grid">
    <div class="player-select">
      <h3>🕹️ PLAYER 1</h3>
      <div class="char-display"><img id="p1img" src="" alt=""/></div>
      <div class="char-name" id="p1name">-</div>
      <div class="char-controls">
        <button class="char-btn" onclick="changeChar(0,-1)">◀</button>
        <button class="char-btn" onclick="changeChar(0,1)">▶</button>
      </div>
      <div class="controls-hint" style="margin-top:10px">
        <span>WASD</span> to drive<br><span>SPACE</span> = item
      </div>
    </div>
    <div class="player-select">
      <h3>🕹️ PLAYER 2</h3>
      <div class="char-display"><img id="p2img" src="" alt=""/></div>
      <div class="char-name" id="p2name">-</div>
      <div class="char-controls">
        <button class="char-btn" onclick="changeChar(1,-1)">◀</button>
        <button class="char-btn" onclick="changeChar(1,1)">▶</button>
      </div>
      <div class="controls-hint" style="margin-top:10px">
        <span>↑↓←→</span> to drive<br><span>ENTER</span> = item
      </div>
    </div>
  </div>

  <div class="controls-hint">
    Complete <span>3 laps</span> to win! Stay on track or you'll slow down!
  </div>
  <button id="startBtn" onclick="startGame()">🏁 START RACE! 🏁</button>
  <button onclick="toggleFullscreen()" style="background:rgba(255,255,255,0.15);color:#FFD700;border:2px solid #FFD700;padding:8px 24px;font-family:inherit;font-size:16px;cursor:pointer;border-radius:6px;letter-spacing:1px">⛶ FULLSCREEN (F11)</button>
</div>

<!-- HUB BUTTON — always visible bottom-left -->
<a href="../index.html" id="hub-btn">← HUB</a>

<!-- SPLIT DIVIDER -->
<div id="divider"></div>

<!-- HUD -->
<div id="hud">
  <div class="player-hud" id="hud1">
    <div class="hud-name" id="hud1name">P1</div>
    <div class="hud-lap">Lap <span id="hud1lap">1</span>/3</div>
    <div class="hud-speed">⚡ <span id="hud1speed">0</span> km/h</div>
    <div id="hud1item" style="font-size:20px; min-height:24px"></div>
  </div>
  <div class="player-hud" id="hud2">
    <div class="hud-name" id="hud2name">P2</div>
    <div class="hud-lap">Lap <span id="hud2lap">1</span>/3</div>
    <div class="hud-speed">⚡ <span id="hud2speed">0</span> km/h</div>
    <div id="hud2item" style="font-size:20px; min-height:24px"></div>
  </div>
  <div id="raceTimer">00:00</div>
</div>

<!-- COUNTDOWN -->
<div id="countdown"></div>

<!-- WIN SCREEN -->
<div id="winScreen">
  <div id="winContent">
    <div id="winConfetti"></div>
    <div id="winTrophy">🏆</div>
    <h2 id="winTitle">RACE OVER!</h2>
    <div id="winPodium">
      <div class="podium-entry" id="podium1st">
        <div class="podium-medal">🥇</div>
        <div class="podium-char-img-wrap"><img id="win1img" src="" alt=""/></div>
        <div class="podium-name" id="win1name"></div>
        <div class="podium-time" id="win1time"></div>
        <div class="podium-block gold-block">1st</div>
      </div>
      <div class="podium-entry" id="podium2nd">
        <div class="podium-medal">🥈</div>
        <div class="podium-char-img-wrap"><img id="win2img" src="" alt=""/></div>
        <div class="podium-name" id="win2name"></div>
        <div class="podium-time" id="win2time"></div>
        <div class="podium-block silver-block">2nd</div>
      </div>
    </div>
    <button id="winMenuBtn" onclick="backToMenu()">🏠 MAIN MENU</button>
  </div>
</div>

<canvas id="canvas1"></canvas>
<canvas id="canvas2"></canvas>

<script src="three.min.js"></script>
<script src="grand_meme_prix.js"></script>
</body>
</html>
