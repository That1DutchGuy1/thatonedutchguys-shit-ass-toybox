<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../device-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex, nofollow">
    <title>Rick Roller 2D - Deluxe Edition</title>
    <link rel="icon" type="image/x-icon" href="./rick-roll-2d.ico">
    <link rel="stylesheet" href="rick-roll-2d.css">
</head>
<body>
    <div id="game-ui">
        <h1>Rick Roller 2D - Deluxe Edition</h1>
        <div id="stats-bar" style="display: none;">
            <span id="lives-display">Lives: 3</span> | 
            <span id="level-display">Level: 1</span> | 
            <span id="score-display">Score: 0</span>
        </div>
    </div>
    
    <div id="game-container">
        <canvas id="gameCanvas" tabindex="0"></canvas>
        <div id="main-menu">
            <h2 style="color: #ffcc00;">DELUXE EDITION</h2>
            <p>Collect the CDs for extra lives!</p>
            <button id="start-btn">START GAME</button>
            <p id="menu-highscore"></p>
        </div>

        <div id="game-over-screen">
            <h1 id="game-over-title">GAVE YOU UP</h1>
            <p id="game-over-highscore"></p>
            <p id="game-over-sub">You gave him up...</p>
            <button id="retry-btn">TRY AGAIN</button>
        </div>

        <div id="win-screen">
            <h1 id="win-title">YOU WON!!! 🎉</h1>
            <p id="win-highscore"></p>
            <p id="win-sub">WOAH! YOU DID IT!</p>
            <button id="play-again-btn">PLAY AGAIN</button>
        </div>
    </div>

    <audio id="bgMusic" src="8-bit-never-gonna-give-you-up.mp3" loop></audio>
    <audio id="deathScream" src="rick-astley-screaming-meme.mp3"></audio>
    <audio id="victoryMusic" src="victory.mp3"></audio>
    <audio id="loseMusic" src="lose.mp3"></audio>

    <img id="rickSpriteSheet" src="Rick Astley HD transparent sprite sheet.png" crossorigin="anonymous" style="display:none;">

    <script src="rick-roll-2d.js"></script>

    <a href="../index.html" id="hub-btn">← HUB</a>
    <a href="https://www.youtube.com/@That1DutchGuy" target="_blank" style="right: 10px;">Made by YouTuber That One Dutch Guy</a>
</body>
</html>
